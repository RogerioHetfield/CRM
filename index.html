<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>CRM Premium</title>
    <link rel="stylesheet" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  </head>
  <body>
    <div class="app">
      <!-- SIDEBAR -->
      <aside class="sidebar">
        <h2>📊 CRM</h2>
        <button onclick="abrirModal()">+ Novo Lead</button>
      </aside>

      <!-- MAIN -->
      <main>
        <header class="topo">
          <div class="card-topo">Total: <span id="total"></span></div>
          <div class="card-topo">
            Interessados: <span id="interessados"></span>
          </div>
          <div class="card-topo">Fechados: <span id="fechados"></span></div>
        </header>

        <section id="lista"></section>
      </main>
    </div>

    <!-- MODAL -->
    <div id="modal" class="modal">
  <div class="modal-box">

    <h2>✨ Novo Lead</h2>

    <div class="input-group">
      <input id="nome" required>
      <label>Nome do estabelecimento</label>
    </div>

    <div class="input-group">
      <input id="tipo" required>
      <label>Tipo (pizza, táxi...)</label>
    </div>

    <div class="input-group">
      <input id="telefone" required>
      <label>WhatsApp</label>
    </div>

    <div class="input-group">
      <input id="followup" type="datetime-local">
      <label>Follow-up</label>
    </div>

    <button class="btn-save" onclick="addLead()">Salvar Lead</button>
    <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>

  </div>
</div>

    <script src="script.js"></script>
  </body>
</html>
