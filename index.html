<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RogZ CRM</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h2>📊 RogZ CRM</h2>
  <input id="busca" placeholder="Buscar..." oninput="render()">
  <button onclick="toggleDark()">🌙</button>
  <button onclick="abrirModal()">+ Lead</button>
</header>

<div class="board">

  <div class="coluna" data-status="Não contatado">
    <h3>Não contatado</h3>
    <div class="dropzone" id="nao"></div>
  </div>

  <div class="coluna" data-status="Chamado">
    <h3>Chamado</h3>
    <div class="dropzone" id="chamado"></div>
  </div>

  <div class="coluna" data-status="Interessado">
    <h3>Interessado</h3>
    <div class="dropzone" id="interessado"></div>
  </div>

  <div class="coluna" data-status="Fechado">
    <h3>Fechado</h3>
    <div class="dropzone" id="fechado"></div>
  </div>

</div>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-box">

    <h2>✨ Novo Lead</h2>

    <div class="input-group">
      <input id="nome" required>
      <label>Nome do estabelecimento</label>
    </div>

    <div class="input-group">
      <input id="tipo" required>
      <label>Tipo (pizza, táxi...)</label>
    </div>

    <div class="input-group">
      <input id="telefone" required>
      <label>WhatsApp</label>
    </div>

    <div class="input-group">
      <input id="followup" type="datetime-local">
      <label>Follow-up</label>
    </div>

    <button class="btn-save" onclick="addLead()">Salvar Lead</button>
    <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
