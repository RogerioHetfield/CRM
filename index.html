<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Simples</title>

<style>
body { font-family: Arial; margin:0; background:#f4f6f9; }

header {
  background:#111;
  color:#fff;
  padding:10px;
  display:flex;
  gap:10px;
}

header input { flex:1; padding:8px; }

.board {
  display:flex;
  gap:10px;
  padding:10px;
  overflow-x:auto;
}

.coluna {
  min-width:250px;
  background:#eee;
  padding:10px;
  border-radius:10px;
}

.card {
  background:#fff;
  padding:10px;
  margin-bottom:10px;
  border-radius:8px;
}

.modal {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.5);
}

.modal-box {
  background:#fff;
  padding:20px;
  width:300px;
  margin:100px auto;
  border-radius:10px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

button { padding:10px; cursor:pointer; }
</style>
</head>

<body>

<header>
  <input id="busca" placeholder="Buscar..." oninput="render()">
  <button onclick="abrirModal()">+ Lead</button>
</header>

<div class="board">
  <div class="coluna" data-status="Não contatado"><h3>Não contatado</h3><div id="nao"></div></div>
  <div class="coluna" data-status="Chamado"><h3>Chamado</h3><div id="chamado"></div></div>
  <div class="coluna" data-status="Interessado"><h3>Interessado</h3><div id="interessado"></div></div>
  <div class="coluna" data-status="Fechado"><h3>Fechado</h3><div id="fechado"></div></div>
</div>

<div id="modal" class="modal">
  <div class="modal-box">
    <input id="nome" placeholder="Nome">
    <input id="telefone" placeholder="WhatsApp">
    <button onclick="addLead()">Salvar</button>
    <button onclick="fecharModal()">Cancelar</button>
  </div>
</div>

<script>
let leads = JSON.parse(localStorage.getItem("leads")) || [];
let dragId = null;

function salvar(){
  localStorage.setItem("leads", JSON.stringify(leads));
}

function abrirModal(){
  document.getElementById("modal").style.display="block";
}

function fecharModal(){
  document.getElementById("modal").style.display="none";
}

function addLead(){
  const nome = document.getElementById("nome").value;
  const telefone = document.getElementById("telefone").value;

  if(!nome || !telefone){
    alert("Preencha os campos");
    return;
  }

  leads.push({
    id: Date.now(),
    nome,
    telefone,
    status:"Não contatado"
  });

  salvar();
  fecharModal();
  render();
}

function render(){
  ["nao","chamado","interessado","fechado"].forEach(id=>{
    document.getElementById(id).innerHTML="";
  });

  const busca = document.getElementById("busca").value.toLowerCase();

  leads
    .filter(l=>l.nome.toLowerCase().includes(busca))
    .forEach(l=>{
      const el = document.createElement("div");
      el.className="card";
      el.draggable=true;

      el.innerHTML = `
        <strong>${l.nome}</strong><br>
        ${l.telefone}<br>
        <button onclick="abrirWhats('${l.telefone}')">Whats</button>
      `;

      el.ondragstart=()=>dragId=l.id;

      document.getElementById(getColuna(l.status)).appendChild(el);
    });
}

function getColuna(s){
  if(s==="Não contatado") return "nao";
  if(s==="Chamado") return "chamado";
  if(s==="Interessado") return "interessado";
  if(s==="Fechado") return "fechado";
}

document.querySelectorAll(".coluna").forEach(col=>{
  col.ondragover=e=>e.preventDefault();
  col.ondrop=()=>{
    const status=col.dataset.status;
    leads = leads.map(l=>l.id===dragId?{...l,status}:l);
    salvar();
    render();
  };
});

function abrirWhats(num){
  window.location.href=`https://wa.me/${num}`;
}

render();
</script>

</body>
</html>
